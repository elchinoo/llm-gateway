[project]
name = "llmgw"
version = "0.1.0"
description = "The ecosystem's shared LLM gateway: one OpenAI-compatible endpoint in front of your model providers, with per-app keys, budgets, rate limits, failover and usage metering, on Postgres."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "agentpg-kit>=0.3.1",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary,pool]>=3.2",
  "httpx>=0.27",
  "cryptography>=43",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
llmgw = "llmgw.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmgw"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "B905", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

# Local development: use the sibling checkout of the kit. Images install the published kit instead (see Dockerfile).
[tool.uv.sources]
agentpg-kit = { path = "../agentpg-kit", editable = true }
